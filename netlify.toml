[build]
  publish = "public"
  command = "npm install"

[functions]
  directory = "netlify/functions"
  external_node_modules = ["express", "serverless-http", "@libsql/client", "bcryptjs", "express-session", "cookie-parser", "dotenv"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
